<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>🪹 Yuva</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--pnl:#161b22;--pnl2:#1c2430;--brd:#30363d;--fg:#e6edf3;--dim:#8b949e;
--goreci:#f0883e;--isci:#58a6ff;--denetci:#d2a8ff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;
display:grid;grid-template-rows:auto auto 1fr;height:100vh;overflow:hidden}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--brd);
background:var(--pnl)}
header h1{font-size:16px;white-space:nowrap}
.rozet{font-size:12px;padding:1px 9px;border:1px solid var(--brd);border-radius:10px;color:var(--dim)}
.rozet b{color:var(--fg)}
#saat{margin-left:auto;color:var(--dim);font-size:12px}
#serit{background:#3d1d1d;color:#ffb4ab;font-size:12px;padding:5px 14px;border-bottom:1px solid var(--brd)}
.gizli{display:none!important}
main{display:grid;grid-template-columns:minmax(330px,1fr) minmax(460px,1.35fr);min-height:0;overflow:hidden}
body.harita-tam main{grid-template-columns:minmax(0,1fr)}
body.harita-tam #sol{display:none}
body.harita-tam #sag{grid-template-rows:auto minmax(0,1fr)}
body.harita-tam #sekmeler{grid-row:1}
body.harita-tam #b-harita{grid-row:2;min-height:0}
#sol{display:grid;grid-template-rows:auto auto 1fr auto;border-right:1px solid var(--brd);min-height:0}
.baslik{font-size:12px;color:var(--dim);padding:7px 14px;border-bottom:1px solid var(--brd);
display:flex;gap:8px;align-items:center}
.ipucu{color:var(--dim);font-size:11px;opacity:.8}
#sohbet{overflow-y:auto;padding:10px 14px}
.msg{margin-bottom:9px}
.msg .satir1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.zaman{color:var(--dim);font-size:11px}
.kimden{font-weight:bold}
.kime{color:var(--dim);font-size:11px}
.metin{white-space:pre-wrap;word-break:break-word}
.msg.ozel{border-left:2px solid var(--brd);padding-left:8px}
.msg.kullanici{background:var(--pnl2);border:1px solid var(--brd);border-radius:8px;padding:8px 10px}
.msg.kullanici .kimden{color:var(--ok)}
.msg.sistem{color:var(--dim);font-size:12px}
.msg.sistem .metin{opacity:.85}
#yazma{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:9px 14px;
border-top:1px solid var(--brd);background:var(--pnl);align-items:end}
select,textarea,input,button{font:inherit;color:var(--fg);background:var(--bg);
border:1px solid var(--brd);border-radius:7px;padding:6px 8px}
select{max-width:150px}
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;padding:6px 24px 6px 9px;
 background-color:var(--pnl2);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%238b949e' stroke-width='1.4'/></svg>");
 background-repeat:no-repeat;background-position:right 7px center;text-overflow:ellipsis}
select option{background:var(--pnl2);color:var(--fg)}
textarea{resize:vertical;min-height:38px}
button{cursor:pointer;background:var(--pnl2)}
button:hover{border-color:var(--dim)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{
outline:2px solid #79c0ff;outline-offset:2px}
button.ana{background:#1f6feb;border-color:#1f6feb;color:#fff}
#sag{display:grid;grid-template-rows:auto 1fr;min-height:0}
#sekmeler{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--brd);background:var(--pnl);overflow-x:auto}
.sekme{border-radius:8px;font-size:13px}
.sekme.aktif{background:var(--pnl2);border-color:var(--dim)}
.bolum{overflow-y:auto;padding:12px;min-height:0}
#b-harita{padding:0;overflow:hidden}
.harita-kaydir{height:100%;min-height:0;overflow:auto;padding:14px;overscroll-behavior:contain;
 cursor:grab;touch-action:pan-x pan-y pinch-zoom}
.harita-kaydir[role="region"]:focus-visible{outline:2px solid #79c0ff;outline-offset:-2px}
.harita-kaydir.surukleniyor{cursor:grabbing;user-select:none}
.harita-kaydir.surukleniyor *{cursor:grabbing!important}
.harita-yuzey{position:relative;width:100%;min-width:0;min-height:100%;padding:5px}
.harita-baglar{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.harita-oklar{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4}
.harita-ok-hedef{stroke:#0d1117;stroke-width:1.5;opacity:.98;
 filter:drop-shadow(0 1px 2px #000b)}
.harita-ok-hedef.baglanti-vurgulu{stroke:#fff;stroke-width:2.5;opacity:1}
.harita-ok-hedef.secili{stroke-width:2.5;opacity:1}
.harita-icerik{position:relative}
.harita-baslik{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.harita-baslik h2{font-size:14px}
.harita-baslik .ipucu{color:#c9d1d9;font-size:12px;opacity:1}
.harita-uyari{margin-bottom:10px;padding:7px 10px;border:1px solid var(--warn);border-radius:7px;
 background:#2b2210;color:#f0c674;font-size:12px}
.harita-bolum-baslik{font-size:12px;color:var(--dim);margin:12px 0 7px}
.harita-katman{position:relative;z-index:2;margin:0 0 28px;padding:8px;border:1px solid var(--brd);border-radius:9px;background:#0f141b}
.harita-katman-etiket{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0}
.harita-katman-kisiler{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-width:0;width:100%}
.harita-ekipler{display:grid;gap:14px;margin:0 0 28px}
.harita-ekip{--ekip-renk:#8b949e;position:relative;z-index:2;padding:10px;border:1px solid var(--brd);
 border-left:3px solid var(--ekip-renk);border-radius:9px;background:#0f141b}
.harita-ekip.secili{box-shadow:0 0 0 2px var(--ekip-renk)}
.harita-ekip-baslik{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 9px;color:#e6edf3;font-size:12px}
.harita-ekip-baslik small{color:var(--dim);font-size:10px;font-weight:normal}
.harita-ekip-roller{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.harita-ekip-rol h4{margin:0 0 6px;color:var(--dim);font-size:11px}
.harita-ekip-rol .harita-katman-kisiler{justify-content:flex-start}
.harita-kisi.ekip-uyesi{border-left:3px solid var(--ekip-renk)}
.harita-kisi.denetcisi-secili{outline:2px solid var(--ekip-renk);outline-offset:2px}
.harita-kisi.ekip-vurgulu{box-shadow:0 0 0 2px var(--ekip-renk),0 5px 14px #0005}
.harita-yuzey.ekip-secimi .harita-ekip:not(.secili),
.harita-yuzey.ekip-secimi .harita-atanmamis,
.harita-yuzey.ekip-secimi .harita-kisi[data-h-kisi]:not(.denetcisi-secili):not(.ekip-vurgulu){opacity:.48}
.harita-kume-rozet{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid var(--ekip-renk);
 border-radius:10px;color:#e6edf3;font-size:10px;white-space:nowrap}
.harita-kume-rozet.bas-denetci-rozet{border-color:var(--denetci);color:#e6ccff}
.harita-atanmamis{padding:10px;border:1px dashed var(--brd);border-radius:9px;background:#0f141b}
.harita-atanmamis>h3{margin:0 0 8px;color:#c9d1d9;font-size:12px}
.harita-hiyerarsi{fill:none;stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;opacity:.9}
.harita-hiyerarsi.secili{stroke-width:3;opacity:1}
.harita-hiyerarsi-ucu{fill:#0f141b;stroke-width:2}
.harita-efsane-item .harita-hiyerarsi-ornek{position:relative;display:inline-block;width:24px;height:0;
 border-top:2px dotted #d2a8ff}
.harita-efsane-item .harita-hiyerarsi-ornek::after{content:"●";position:absolute;right:-2px;top:-8px;
 color:#d2a8ff;font-size:12px;line-height:12px}
.harita-kisi,.harita-gorev{position:relative;background:var(--pnl);border:1px solid var(--brd);
 border-radius:9px;padding:9px 10px;box-shadow:0 5px 14px #0005}
.harita-kisi{width:min(100%,280px);flex:0 1 280px;min-height:96px;border-top:2px solid var(--dim)}
.harita-kisi[data-h-isci]{cursor:pointer}
.harita-kisi[data-h-denetci]{cursor:pointer}
.harita-kisi[data-h-isci]:hover{border-color:#79c0ff;box-shadow:0 0 0 1px #79c0ff55,0 5px 14px #0005}
.harita-kisi[data-h-isci]:focus-visible{outline:2px solid #79c0ff;outline-offset:2px}
.harita-kisi[data-h-denetci]:hover{border-color:#d2a8ff;box-shadow:0 0 0 1px #d2a8ff55,0 5px 14px #0005}
.harita-kisi[data-h-denetci]:focus-visible{outline:2px solid #d2a8ff;outline-offset:2px}
.harita-kisi-etkinlik{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.harita-etkinlik{display:inline-flex;border:1px solid var(--brd);border-radius:10px;padding:1px 6px;
 color:#c9d1d9;font-size:10px}
.harita-etkinlik.alinan{border-color:#1f6feb;color:#79c0ff}
.harita-etkinlik.kontrol{border-color:#d2a8ff;color:#e6ccff}
.harita-etkinlik.teslim{border-color:#9e6a03;color:#f0c674}
.harita-etkinlik.revize{border-color:#da3633;color:#ffb4ab}
.harita-kisi.online{border-top-color:var(--ok)}
.harita-kisi.offline{border-top-color:#8b949e}
.harita-kisi.belirsiz{border-top-color:var(--warn)}
.harita-kisi-ust{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.harita-kisi-ad{font-size:13px;font-weight:bold;overflow-wrap:anywhere}
.harita-kimlik{display:block;color:#b1bac4;font-size:10px;overflow-wrap:anywhere;margin-top:2px}
.harita-rozet{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--brd);
 border-radius:12px;padding:1px 6px;font-size:10px;color:var(--fg)}
.harita-rozet.online{border-color:#238636;color:#7ee787}
.harita-rozet.offline{border-color:#6e7681;color:#c9d1d9}
.harita-rozet.belirsiz{border-color:#9e6a03;color:#f0c674}
.harita-kisi-alt{margin-top:7px;color:#c9d1d9;font-size:11px;line-height:1.6}
.harita-kisi-alt b{color:var(--dim);font-weight:normal}
.harita-mobil-bag{display:none;margin-top:6px;color:#c9d1d9;font-size:10px;line-height:1.5}
.harita-mobil-bag b{color:var(--dim);font-weight:normal}
.harita-gorev-sutunlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 width:100%;max-width:1560px;margin-inline:auto;gap:8px;align-items:start}
.harita-gorev-sutun{position:relative;z-index:2;min-height:90px;border:1px solid var(--brd);border-radius:8px;
 background:transparent;padding:6px}
.harita-gorev-sutun h4{position:relative;z-index:3;background:#0f141b;font-size:11px;color:#c9d1d9;
 padding:2px 3px 6px;border-bottom:1px solid var(--brd)}
.harita-gorev-listesi{display:grid;gap:7px;padding-top:7px}
.harita-gorev{z-index:3;padding:8px;background:var(--pnl);box-shadow:none}
.harita-gorev:focus-visible{outline:2px solid #79c0ff;outline-offset:2px}
.harita-gorev-id{font-size:10px;color:#b1bac4}
.harita-gorev-baslik{font-size:12px;font-weight:bold;overflow-wrap:anywhere;margin:3px 0 6px}
.harita-gorev-durum{display:inline-block;font-size:10px;padding:1px 6px;border:1px solid var(--brd);
 border-radius:10px;color:#c9d1d9}
.harita-gorev-durum.dur-pending{border-color:#6e7681;color:#c9d1d9}
.harita-gorev-durum.dur-assigned{border-color:#1f6feb;color:#79c0ff}
.harita-gorev-durum.dur-verified{border-color:#238636;color:#7ee787}
.harita-gorev-durum.dur-dropped{border-color:#8b949e;color:#c9d1d9}
.harita-gorev-durum.dur-pending_gorevli_review{border-color:#d2a8ff;color:#e6ccff}
.harita-gorev-durum.dur-pending_verification{border-color:#9e6a03;color:#f0c674}
.harita-gorev-durum.dur-pending_revision{border-color:#da3633;color:#ffb4ab}
.harita-gorev-kisi{margin-top:5px;color:#c9d1d9;font-size:10px;overflow-wrap:anywhere}
.harita-gorev-kisi b{color:var(--dim);font-weight:normal}
.harita-agaci{max-width:1600px;margin:0 auto 16px}
.harita-agaci-baslik{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 9px}
.harita-agaci-baslik h3{font-size:13px}
.harita-agaci>summary,.harita-kisi-iliskileri>summary{cursor:pointer;padding:10px 12px;color:#c9d1d9;font-size:12px;font-weight:bold}
.harita-agaci>summary:focus-visible,.harita-agaci summary:focus-visible,.harita-kisi-iliskileri>summary:focus-visible{
 outline:2px solid #79c0ff;outline-offset:2px;border-radius:7px}
.harita-agaci-kokleri{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px;align-items:start;max-width:1580px;margin-inline:auto}
.harita-agaci-kokleri>.harita-agaci-kok:last-child:nth-child(2n+3){grid-column:1/-1;width:calc(50% - 9px);justify-self:center}
.harita-agaci-kok{position:relative;min-width:0;padding:16px 18px;border:1px solid var(--brd);border-radius:10px;background:#0f141b}
.harita-agaci-kok-baslik{margin:0 0 9px;text-align:center;color:var(--dim);font-size:11px}
.harita-agaci-kok>.harita-gorev{width:min(100%,520px);margin-inline:auto;border-top:2px solid var(--brd)}
.harita-agaci-dal{position:relative;margin:4px 0 0;border:0;background:transparent;text-align:center}
.harita-agaci-dal>summary{display:table;min-height:32px;margin:0 auto;padding:6px 11px;border:1px solid #28643b;border-radius:16px;
 background:#102019;color:#7ee787;cursor:pointer;font-size:12px;font-weight:bold;position:relative;z-index:1}
.harita-agaci-dal>summary:focus-visible{outline:2px solid #79c0ff;outline-offset:2px}
.harita-agaci-bag-cizim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.harita-agaci-bag-cizim path{fill:none;stroke:#58a6ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.harita-agaci-bag-cizim .harita-agaci-ok-ucu{fill:#58a6ff;stroke:none}
.harita-agaci-bag-cizim circle{fill:#0f141b;stroke:#58a6ff;stroke-width:2}
.harita-gorev-agaci{position:relative;display:grid;
 grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px 12px;
 width:100%;min-width:0;max-width:100%;margin:0 auto;padding:8px 0 0;overflow:visible;
 list-style:none}
.harita-gorev-agaci::before{display:none}
.harita-gorev-agaci>li{position:relative;min-width:0;padding:20px 0 0;text-align:left}
.harita-gorev-agaci>li[role="listitem"]{list-style:none}
.harita-agaci-kol{display:none}
.harita-gorev-agaci>li>.harita-gorev,.harita-gorev-agaci>li>.harita-agaci-arsiv-dal,
.harita-gorev-agaci>li>.harita-agaci-dugum{position:relative;z-index:1}
.harita-agaci-arsiv-dal{border:1px dashed #6e7681;border-radius:9px;background:#111820}
.harita-agaci-arsiv-dal>summary{padding:8px 10px;color:#c9d1d9;cursor:pointer;font-size:11px;font-weight:bold;
 overflow-wrap:anywhere}
.harita-agaci-arsiv-dal>summary:focus-visible{outline:2px solid #79c0ff;outline-offset:2px;border-radius:7px}
.harita-agaci-arsiv-dal .harita-gorev{border-top:2px solid #8b949e}
.harita-agaci-detay-grup{margin:12px 0;border:1px solid var(--brd);border-radius:9px;background:#0f141b}
.harita-agaci-detay-grup>summary{padding:10px 12px;color:#c9d1d9;cursor:pointer;font-size:12px;font-weight:bold}
.harita-agaci-detay-grup>summary:focus-visible{outline:2px solid #79c0ff;outline-offset:2px;border-radius:7px}
.harita-agaci-detay-grup>.harita-agaci-kokleri{padding:4px 10px 10px}
.harita-legacy-kontrol{display:flex;align-items:end;gap:10px;flex-wrap:wrap;padding:10px}
.harita-legacy-kontrol label{display:grid;gap:4px;color:#c9d1d9;font-size:11px}
.harita-legacy-kontrol input{min-width:min(320px,75vw);padding:7px 9px;background:var(--pnl);color:var(--fg);border:1px solid var(--brd);border-radius:7px}
.harita-legacy-sayac{color:#b1bac4;font-size:11px}
.harita-legacy-listesi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:7px;padding:0 10px 10px;align-items:start}
.harita-legacy-kart .harita-gorev{padding:6px 8px;box-shadow:none}
.harita-legacy-kart .harita-gorev-kisi{margin-top:3px}
.harita-legacy-kart[hidden]{display:none!important}
.harita-legacy-sayfalar{display:flex;align-items:center;justify-content:flex-start;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.harita-legacy-sayfalar button{min-height:32px;padding:5px 9px}
.harita-legacy-sayfalar button:focus-visible{outline:2px solid #79c0ff;outline-offset:2px}
.harita-legacy-sayfalar button:disabled{opacity:.45;cursor:not-allowed}
.harita-agaci-uyari{margin:8px 0;padding:8px 10px;border:1px solid var(--warn);border-radius:8px;background:#2b2210;color:#f0c674;font-size:11px}
.harita-gorev-legacy{margin:8px 0;border:1px solid #8b949e;border-radius:8px;background:#0f141b;padding:8px}
.harita-gorev-legacy>.harita-gorev{border-left:3px solid #8b949e}
.harita-agaci-kontrol{display:flex;gap:6px;flex-wrap:wrap}
.harita-agaci-kontrol button{padding:4px 8px;font-size:11px}
.harita-iliski-efsane{display:flex;gap:12px;flex-wrap:wrap;margin:7px 0 12px;color:#c9d1d9;font-size:10px}
.harita-iliski-efsane span{display:flex;align-items:center;gap:5px}
.harita-iliski-cizgi{position:relative;display:inline-block;width:22px;border-top:2px solid #58a6ff}
.harita-iliski-cizgi::after{content:"";position:absolute;right:-1px;top:-4px;border-top:4px solid transparent;
 border-bottom:4px solid transparent;border-left:6px solid var(--ok)}
.harita-iliski-cizgi.acan{border-top:2px dashed #8b949e}
.harita-iliski-cizgi.atanan{border-top:2px dashed #58a6ff}
.harita-iliski-cizgi.kontrol{border-top:2px dotted #d2a8ff}
.harita-iliski-bilgi{display:inline-flex;align-items:center;gap:4px;padding:0 4px;border-radius:5px;background:#1c2430}
.harita-iliski-bilgi::before{content:"";width:6px;height:6px;border-radius:50%;background:#8b949e}
.harita-iliski-bilgi.atanan::before{background:#58a6ff}
.harita-iliski-bilgi.kontrol::before{background:#d2a8ff}
.harita-gorev-kisi.acan b{color:#b1bac4}
.harita-gorev-kisi.atanan b{color:#79c0ff}
.harita-gorev-kisi.kontrol b{color:#e6ccff}
.harita-sorumlu-bag{margin-top:5px;color:#c9d1d9;font-size:10px;overflow-wrap:anywhere}
.harita-sorumlu-bag b{color:var(--dim);font-weight:normal}
.harita-iliski-notu{margin:6px 0;color:#c9d1d9;font-size:11px}
.harita-kisi-iliskileri{margin:12px 0;border:1px solid var(--brd);border-radius:9px;background:#0f141b}
.harita-kisi-iliskileri-icerik{padding:0 10px 10px}
.harita-kisi-iliskileri .harita-ekipler{padding:0 10px 10px}
.harita-arsiv{grid-column:1/-1;margin-top:9px;border:1px solid var(--brd);border-radius:8px;background:#0f141b}
.harita-arsiv>summary{cursor:pointer;padding:8px 10px;color:#c9d1d9;font-size:11px;font-weight:bold}
.harita-arsiv>summary:focus-visible{outline:2px solid #79c0ff;outline-offset:2px;border-radius:7px}
.harita-arsiv .harita-gorev-listesi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));padding:0 8px 8px}
.harita-efsane{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:#c9d1d9;font-size:10px}
.harita-efsane-item{display:inline-flex;align-items:center;gap:5px}

  "<b>—/"+kimlikler.length+"</b> kayıt · çevrimiçi durumu doğrulanamıyor · "+
   (veri.mesajlar||[]).length+" mesaj · rev "+(veri.rev||0):
  "<b>"+online.length+"/"+kimlikler.length+
   "</b> model 🟢 · "+(veri.mesajlar||[]).length+" mesaj · rev "+(veri.rev||0);
 hedefCiz(kimlikler,ks);
 sohbetCiz(veri);
 sohbetDurum(veri);
 sekmeEtiket(online);
 ekipCiz(veri,ks,kimlikler);
 tahtaCiz(veri);
 ekranCiz(veri,ks,kimlikler);
 haritaCiz(veri,ks,kimlikler);
 modalCiz(veri,ks);
}

function sekmeEtiket(online){
 var e=document.querySelector('.sekme[data-s="ekip"]');
 if(!e)return;
 e.textContent=online===null?"👥 Ekip · doğrulanamıyor":
  "👥 Ekip"+(online.length?" · "+online.length+"🟢":"");
}

function hedefCiz(kimlikler,ks){
 var sec=document.getElementById("hedef");
 var eski=S.hedef;
 var html='<option value="@hepsi">@hepsi (herkes)</option>';
 kimlikler.forEach(function(k){
  var v=ks[k]; if(!S.hata&&!onlineMi(v))return;
  var hedef=S.hata&&(eski==="@"+k||eski==="@"+(v.ad||k))?eski:"@"+(v.ad||k);
  html+='<option value="'+esc(hedef)+'">'+(S.hata?"⚪ ":"🟢 ")+"@"+
   esc(v.ad||k)+(S.hata?" · durum doğrulanamıyor":" · "+(ROL_AD[v.rol]||v.rol))+"</option>";
 });
 if(S.hata&&eski!=="@hepsi"&& !kimlikler.some(function(k){
  var v=ks[k]||{};return eski==="@"+(v.ad||k)||eski==="@"+k;
 }))html+='<option value="'+esc(eski)+'">⚪ '+esc(eski)+" · durum doğrulanamıyor</option>";
 sec.innerHTML=html;
 sec.value=eski;
 if(sec.value!==eski&&!S.hata){S.hedef="@hepsi";sec.value="@hepsi";}
}

function sohbetCiz(veri){
 var el=document.getElementById("sohbet");
 var dipteydi=dipte(el);
 var ms=(veri.mesajlar||[]).slice(-80);
 var yeniSayi=0;
 if(S.sonId){
  var i=ms.map(function(x){return x.id;}).indexOf(S.sonId);
  yeniSayi=i>=0?(ms.length-1-i):0;
 }
 var html="";
 if(!ms.length)html='<div class="empty">henüz mesaj yok — aşağıdaki kutudan yaz, tüm modeller görsün.</div>';
 ms.forEach(function(m,idx){
  var kul=(m.kimden==="kullanici");
  var ad=m.ad||m.kimden;
  var rol=kisi(veri,m.kimden).rol;
  var cls="msg"+(kul?" kullanici":(m.tur==="durum"?" sistem":""))+
   (m.kime&&m.kime!=="@hepsi"&&!kul?" ozel":"")+(m.tur==="soru"?" soru":"");
  var onceki=idx>0?ms[idx-1]:null;
  var ardil=!!(onceki&&onceki.kimden===m.kimden&&
   (Date.parse(m.ts)-Date.parse(onceki.ts))>=0&&
   (Date.parse(m.ts)-Date.parse(onceki.ts))<60000);
  var ust=ardil?"<span class=\"zaman\">"+esc(saat(m.ts))+"</span>":
   '<span class="zaman">'+esc(saat(m.ts))+"</span>"+
   '<span class="kimden" style="color:'+(kul?"#3fb950":rolRenk(rol))+'">'+
     esc(kul?"SEN (kullanıcı)":ad)+"</span>"+
   (m.kime&&m.kime!=="@hepsi"&&!kul?'<span class="kime">→ '+esc(m.kime)+"</span>":"")+
   '<span class="kime">'+((m.tur&&m.tur!=="not"&&m.tur!=="durum")?esc(m.tur):"")+"</span>";
  html+='<div class="'+cls+(ardil?" ardil":"")+'"><div class="satir1">'+ust+"</div>"+
   '<div class="metin">'+esc(m.metin)+"</div>"+
   (kul||(m.kime&&m.kime!=="@hepsi")?okumaSatiri(m,veri):"")+"</div>";
 });
 if(S.yeni>0&&!dipteydi)html+='<div class="yeni-mesaj"><button id="yeni-btn">⬇ '+S.yeni+" yeni mesaj</button></div>";
 el.innerHTML=html;
 if(dipteydi){el.scrollTop=el.scrollHeight;S.yeni=0;}else if(yeniSayi>0){S.yeni=yeniSayi;}
 S.sonId=ms.length?ms[ms.length-1].id:S.sonId;
 bekleyenCiz(veri);
}

// hedef kitlesi: mesajı alması gereken kimlikler
function hedefKisiler(m,veri){
 var ks=veri.kullanicilar||{},out=[];
 Object.keys(ks).forEach(function(k){
  var ad=ks[k].ad||k;
  if(m.kimden===k||m.kimden===ad)return;
  if(m.kime==="@hepsi"||m.kime==="@"+ad||m.kime==="@"+k)out.push(k);
 });
 return out;
}
function okuduMu(v,m){return !!(v&&v.son_okuma&&String(m.ts)<=String(v.son_okuma));}

// mesaj başına: kim okudu / kim okumadı
function okumaSatiri(m,veri){
 if(m.tur==="durum")return "";
 if(S.hata)return '<div class="okuma"><span>⚪ çevrimiçi durumu doğrulanamıyor</span></div>';
 var hedef=hedefKisiler(m,veri);
 if(!hedef.length)return "";
 var okuyan=[],bekleyen=[],uykuda=[];
 hedef.forEach(function(k){
  var v=veri.kullanicilar[k];
  if(okuduMu(v,m))okuyan.push(v.ad||k);
  else if(onlineMi(v))bekleyen.push(v.ad||k);
  else uykuda.push(v.ad||k);
 });
 var b="";
 if(okuyan.length)b+='<span class="ok" title="'+esc(okuyan.join(", "))+
  '">👁 '+okuyan.length+"/"+hedef.length+" okudu</span>";
 else b+='<span>📥 '+hedef.length+" modele iletildi — henüz okuyan yok</span>";
 if(bekleyen.length){
  b+='<span class="bek" title="'+esc(bekleyen.join(", "))+
   '">⏳ '+bekleyen.length+" çevrimiçi okumadı</span>";
  b+='<button data-durt="'+esc(m.id)+'" title="okumayan çevrimiçi modellere hatırlatma gönder">🔔 dürt</button>';
 }
 if(uykuda.length)b+='<span title="'+esc(uykuda.join(", "))+
  '">💤 '+uykuda.length+" çevrimdışı</span>";
 return '<div class="okuma">'+b+"</div>";
}

// üstteki "bekleyen mesaj" şeridi
function bekleyenCiz(veri){
 var el=document.getElementById("bekleyen");
 if(S.hata){
  el.classList.remove("gizli");
  el.innerHTML="⚪ Çevrimiçi/çevrimdışı durumu doğrulanamıyor; eski bağlantı verisine göre sayı veya hatırlatma hedefi gösterilmiyor.";
  return;
 }
 var ms=(veri.mesajlar||[]).filter(function(m){return m.kimden==="kullanici";}).slice(-40);
 var onlineK={},offlineK={},mesajlar={};
 ms.forEach(function(m){
  if(m.tur==="durum")return;
  hedefKisiler(m,veri).forEach(function(k){
   var v=veri.kullanicilar[k];
   if(okuduMu(v,m))return;
   mesajlar[m.id]=1;
   if(onlineMi(v))onlineK[v.ad||k]=1;else offlineK[v.ad||k]=1;
  });
 });
 var n=Object.keys(onlineK).length,m2=Object.keys(offlineK).length;
 if(!n&&!m2){el.classList.add("gizli");el.innerHTML="";return;}
 el.classList.remove("gizli");
 var t="📬 ";
 t+=n?"<b>"+n+"</b> çevrimiçi modelin okumadığı <b>"+Object.keys(mesajlar).length+"</b> mesaj var: "+
   esc(Object.keys(onlineK).join(", "))
  :"okumayan çevrimiçi model yok ("+m2+" çevrimdışı model oturumu açınca görecek)";
 t+= n&&m2?" (+"+m2+" çevrimdışı)":"";
 if(n)t+=' <button id="durt-hepsi">🔔 hepsini dürt</button>';
 t+='<span class="ipucu">· modeller `yuva gelen` dediğinde okundu işaretlenir</span>';
 el.innerHTML=t;
}

function sohbetDurum(veri){
 var el=document.getElementById("sohbet-durum");
 if(!el)return;
 var okunmamis={},n=0;
 (veri.mesajlar||[]).filter(function(m){return m.kimden==="kullanici"&&m.tur!=="durum";})
  .slice(-40).forEach(function(m){
   hedefKisiler(m,veri).forEach(function(k){
    if(!okuduMu(veri.kullanicilar[k],m)){okunmamis[m.id]=1;n++;}});
  });
 el.textContent=n?("📬 "+Object.keys(okunmamis).length+" okunmamış mesaj"):"";
}

function modelKart(k,v,veri){
 var on=onlineMi(v), durum=onlineEtiketi(v), renk=rolRenk(v.rol);
 var okunmamis=0;
 (veri.mesajlar||[]).slice(-60).forEach(function(m){
  if(m.kimden===k||m.tur==="durum")return;
  var benim=(m.kimden==="kullanici"&&m.kime==="@hepsi")||m.kime==="@"+(v.ad||k)||m.kime==="@"+k;
  if(benim&&!okuduMu(v,m))okunmamis++;
 });
 var html='<div class="model'+(on?" online":"")+'" style="border-left-color:'+(on?"#3fb950":renk)+'">';
 html+='<div class="m-ust"><span class="isik" title="'+durum+
  '" style="color:'+(on?"#3fb950":"#8b949e")+'">●</span>';
 if(S.duzenle===k){
  html+='<input class="ad-giris" id="ad-giris" value="'+esc(S.duzenleDeger)+
   '" placeholder="ad (örn. sam) — Enter: kaydet, ESC: vazgeç">';
 }else{
  html+='<span class="m-ad rol-'+esc(v.rol)+'">'+esc(v.ad||k)+"</span>";
  if(v.bas_denetci)html+='<span class="rozet-bd">🔍 BAŞ DENETÇİ</span>';
  if(okunmamis&&on)html+='<span class="rozet-say bekle" title="bu modelin henüz okumadığı mesaj">📬 '+okunmamis+"</span>";
  html+='<button class="mini" data-ad-ver="'+esc(k)+'" title="bu modele isim ver">✏️</button>';
 }
 html+="</div>";
 html+='<div class="m-alt">'+esc(k)+" · "+esc(v.arac)+" · "+(ROL_AD[v.rol]||v.rol)+
  " · "+durum+" · "+esc(goreli(v.son_gorulme))+"</div>";
 if(S.duzenle!==k){
  html+='<div class="m-rol"><select data-rol="'+esc(k)+'" title="görev ataması">';
  ["goreci","isci","denetci"].forEach(function(r){
   html+='<option value="'+r+'"'+(v.rol===r?" selected":"")+">"+ROL_AD[r]+"</option>";});
  html+="</select>";
  html+='<label><input type="checkbox" data-bd="'+esc(k)+'"'+(v.bas_denetci?" checked":"")+
   (v.rol==="denetci"?"":" disabled")+"> baş denetçi</label>";
  html+="</div>";
 }
 html+="</div>";
 return html;
}

function ekipCiz(veri,ks,kimlikler){
 var el=document.getElementById("b-ekip");
 var oldInput=S.duzenle&&document.getElementById("ad-giris");
 var editActive=!!(oldInput&&document.activeElement===oldInput);
 var selectionStart=editActive?oldInput.selectionStart:null;
 var selectionEnd=editActive?oldInput.selectionEnd:null;
 if(oldInput)S.duzenleDeger=oldInput.value;
 function editGeriYukle(){
  if(!S.duzenle)return;
  var input=document.getElementById("ad-giris");
  if(!input)return;
  if(editActive||!oldInput){
   input.focus();
   if(editActive&&selectionStart!==null)input.setSelectionRange(selectionStart,selectionEnd);
   else input.select();
  }
 }
 function sirala(dizi){
  return dizi.slice().sort(function(a,b){
   return String(ks[a].ad||a).localeCompare(String(ks[b].ad||b),"tr");});
 }
 if(S.hata){
  var stale='<div class="empty">'+(kimlikler.length?
   "⚪ Bağlantı durumu doğrulanamıyor. Kartlar son alınan panel verisinden gösteriliyor.":
   "⚠️ Panel verisi alınamadı; ekip durumu yüklenemedi.")+"</div>";
  stale+=sirala(kimlikler).map(function(k){return modelKart(k,ks[k],veri);}).join("");
  el.innerHTML=stale;
  editGeriYukle();
  return;
 }
 if(!kimlikler.length){
  el.innerHTML='<div class="empty">henüz model yok. Terminalde:<br>'+
   '<code>yuva baglan codex-1 --ad sam --arac codex --rol denetci</code></div>';
  return;
 }
 var online=[],offline=[];
 kimlikler.forEach(function(k){(onlineMi(ks[k])?online:offline).push(k);});
 var html="";
 if(!online.length){
  html+='<div class="empty">🟢 şu an bağlı model yok.<br>Bir model terminalde '+
   "<code>yuva baglan &lt;ad&gt;</code> dediğinde buraya kartı düşer.</div>";
 }
 html+=sirala(online).map(function(k){return modelKart(k,ks[k],veri);}).join("");
 if(offline.length){
  html+='<div class="katlanmis"><span>⚪ '+offline.length+" çevrimdışı model"+
   (S.cevrimdisi?"":" (gizli)")+'</span><button class="mini" id="cd-ac">'+
   (S.cevrimdisi?"▲ gizle":"▼ göster")+"</button></div>";
  if(S.cevrimdisi)html+=sirala(offline).map(function(k){return modelKart(k,ks[k],veri);}).join("");
 }
 el.innerHTML=html;
 editGeriYukle();
}

function tahtaKartHtml(g,veri,st){
 return '<div class="kart kart-'+st+'"><span class="id">#'+esc(g.id)+"</span> "+esc(g.baslik||"Başlıksız görev")+
  '<div class="kim">'+esc(kisiAd(veri,g.kimden))+" → "+esc(g.assignee?kisiAd(veri,g.assignee):"—")+
  "</div>"+(st==="bilinmiyor"?'<div class="kim">Bilinmeyen durum: '+esc(g.durum||"Durum belirtilmemiş")+"</div>":"")+
  (g.gorevli_kimlik?'<div class="kim">İlk kontrol: '+esc(kisiAd(veri,g.gorevli_kimlik))+
  '</div>':'')+'</div>';
}

function tahtaArsivKartlari(st){
 var veri=S.veri||{}, tum=(veri.gorevler||[]).filter(function(g){return g.durum===st;});
 var durum=S.tahtaArsiv[st], ara=String(durum.arama||"").trim().toLocaleLowerCase("tr-TR");
 var eslesen=ara?tum.filter(function(g){
  var alanlar=[g.id,g.baslik,g.assignee,kisiAd(veri,g.assignee)];
  return alanlar.some(function(x){return String(x==null?"":x).toLocaleLowerCase("tr-TR").indexOf(ara)>=0;});
 }):tum;
 var gorunen=eslesen.slice(0,durum.limit);
 var bilgi=ara?'<div class="tahta-arsiv-bilgi">'+eslesen.length+" sonuç / "+tum.length+" görev</div>":"";
 var kartlar=gorunen.map(function(g){return tahtaKartHtml(g,veri,st);}).join("");
 var kalan=eslesen.length-gorunen.length;
 var devam=kalan>0?'<button class="tahta-arsiv-devam" type="button" data-tahta-devam="'+st+
  '" data-tahta-focus="devam-'+st+'">50 daha göster ('+kalan+' kaldı)</button>':"";
 return '<div class="tahta-arsiv-icerik"><input class="tahta-arsiv-arama" type="search"'+
  ' aria-label="'+esc(DURUM_AD[st])+ ' arşivinde ara (görev no, başlık veya atanan)" placeholder="Arşivde ara: görev no, başlık, atanan"'+
  ' value="'+esc(durum.arama)+'" data-tahta-arama="'+st+'" data-tahta-focus="arama-'+st+'">'+bilgi+
  '<div class="tahta-arsiv-kartlar">'+(kartlar||'<div class="empty">'+(ara?"Eşleşen görev yok.":"Arşiv boş.")+"</div>")+
  '</div>'+devam+'</div>';
}

function tahtaRenderAnahtari(veri,gs){
 return JSON.stringify(gs.map(function(g){
  return [g.id,g.durum,g.baslik,g.kimden,kisiAd(veri,g.kimden),g.assignee,
   kisiAd(veri,g.assignee),g.gorevli_kimlik,kisiAd(veri,g.gorevli_kimlik)];
 }));
}

function tahtaOdakBilgisi(el){
 var aktif=document.activeElement;
 if(!aktif||!el.contains(aktif)||!aktif.getAttribute)return null;
 var anahtar=aktif.getAttribute("data-tahta-focus");
 if(!anahtar)return null;
 return {anahtar:anahtar,bas:typeof aktif.selectionStart==="number"?aktif.selectionStart:null,
  son:typeof aktif.selectionEnd==="number"?aktif.selectionEnd:null};
}

function tahtaOdakGeriYukle(el,odak){
 if(!odak)return;
 var eslesmeler=el.querySelectorAll("[data-tahta-focus]");
 for(var i=0;i<eslesmeler.length;i++)if(eslesmeler[i].getAttribute("data-tahta-focus")===odak.anahtar){
  eslesmeler[i].focus();
  if(odak.bas!==null&&typeof eslesmeler[i].setSelectionRange==="function"){
   eslesmeler[i].setSelectionRange(odak.bas,odak.son);
  }
  break;
 }
}

function tahtaArsivAciklariniOku(el){
 TAHTA_ARSIV.forEach(function(st){
  var detay=el.querySelector('details[data-tahta-arsiv="'+st+'"]');
  if(detay)S.tahtaArsiv[st].acik=detay.open;
 });
}

function tahtaArsivIcerikCiz(st){
 var detay=document.querySelector('#b-tahta details[data-tahta-arsiv="'+st+'"]');
 if(!detay||!detay.open)return;
 var once=tahtaOdakBilgisi(detay);
 detay.innerHTML='<summary data-tahta-focus="arsiv-baslik-'+st+'">'+esc(DURUM_AD[st])+" ("+
  (S.veri.gorevler||[]).filter(function(g){return g.durum===st;}).length+
  ')</summary>'+tahtaArsivKartlari(st);
 tahtaOdakGeriYukle(detay,once);
}

function tahtaCiz(veri){
 var el=document.getElementById("b-tahta"), gs=veri.gorevler||[];
 var anahtar=tahtaRenderAnahtari(veri,gs);
 if(anahtar===S.tahtaRenderAnahtari)return;
 var odak=tahtaOdakBilgisi(el);
 tahtaArsivAciklariniOku(el);
 S.tahtaRenderAnahtari=anahtar;
 if(!gs.length){
  el.innerHTML='<div class="empty">henüz görev yok. Baş denetçi/görevli model:<br>'+
   '<code>yuva gorev ekle "iş" --from sam --ata sus</code></div>';
  return;
 }
 var html="";
 TAHTA_AKTIF.forEach(function(st){
  var kol=gs.filter(function(g){return g.durum===st;});
  html+='<div class="kol"><h3 data-d="'+st+'">'+(DURUM_AD[st]||st)+" ("+kol.length+")</h3>";
  html+=kol.length?kol.map(function(g){return tahtaKartHtml(g,veri,st);}).join(""):'<div class="empty">—</div>';
  html+="</div>";
 });
 TAHTA_ARSIV.forEach(function(st){
  var sayi=gs.filter(function(g){return g.durum===st;}).length;
  html+='<details class="tahta-arsiv" data-tahta-arsiv="'+st+'"'+
   (S.tahtaArsiv[st].acik?' open':'')+'><summary data-tahta-focus="arsiv-baslik-'+st+'">'+esc(DURUM_AD[st])+" ("+sayi+")</summary>"+
   (S.tahtaArsiv[st].acik?tahtaArsivKartlari(st):"")+'</details>';
 });
 var bilinmeyenler=gs.filter(function(g){return TAHTA_AKTIF.indexOf(g.durum)<0&&TAHTA_ARSIV.indexOf(g.durum)<0;});
 if(bilinmeyenler.length){
  html+='<div class="kol tahta-bilinmeyen"><h3>Bilinmeyen durum ('+bilinmeyenler.length+')</h3>'+
   bilinmeyenler.map(function(g){return tahtaKartHtml(g,veri,"bilinmiyor");}).join("")+"</div>";
 }
 el.innerHTML=html;
 TAHTA_ARSIV.forEach(function(st){
  var detay=el.querySelector('details[data-tahta-arsiv="'+st+'"]');
  if(detay)detay.addEventListener("toggle",function(){
   S.tahtaArsiv[st].acik=detay.open;
   if(detay.open&&!detay.querySelector(".tahta-arsiv-icerik"))tahtaArsivIcerikCiz(st);
  });
 });
 tahtaOdakGeriYukle(el,odak);
}

function haritaGorevHtml(g,veri,ks,etiket,kompaktLegacy){
 var durumSinif=DURUM_SIRA.indexOf(g.durum)>=0?g.durum:"bilinmiyor";
 var acan=!g.kimden?"Belirtilmemiş":
  (Object.prototype.hasOwnProperty.call(ks,g.kimden)?kisiAd(veri,g.kimden):g.kimden+" (kimlik eşleşmedi)");
 var atanan=!g.assignee?(g.durum==="pending"?"Atama bekliyor":"Atanmamış"):
  (Object.prototype.hasOwnProperty.call(ks,g.assignee)?kisiAd(veri,g.assignee):g.assignee+" (kimlik eşleşmedi)");
 var atananKisi=ks[g.assignee]||{},atananMeta=atananKisi.arac||atananKisi.rol?

  esc(ROL_AD[atananKisi.rol]||atananKisi.rol||"rol belirtilmemiş"):'';
 var acanEtiket=g.kimden&&Object.prototype.hasOwnProperty.call(ks,g.kimden)?
  acan+' · '+g.kimden:acan;
 var gorevliEtiket=g.gorevli_kimlik&&Object.prototype.hasOwnProperty.call(ks,g.gorevli_kimlik)?
  kisiAd(veri,g.gorevli_kimlik)+' · '+g.gorevli_kimlik:g.gorevli_kimlik;
 var gorevKimlik='<div class="harita-gorev-id">Görev #'+esc(g.id)+'</div>',gorevBaslik='<div class="harita-gorev-baslik">'+
  esc(g.baslik||"Başlıksız görev")+'</div>',gorevDurum='<span class="harita-gorev-durum dur-'+durumSinif+'">'+
  esc(DURUM_AD[g.durum]||g.durum||"Durum belirtilmemiş")+'</span>';
 return '<article class="harita-gorev" data-h-gorev="'+esc(g.id)+'" data-h-ust-gorev="'+
  esc(g.ust_gorev_id==null?"":g.ust_gorev_id)+'" data-h-kimden="'+

  (kompaktLegacy?gorevKimlik+gorevDurum+gorevBaslik:gorevKimlik+gorevBaslik+gorevDurum)+(etiket?'<span class="harita-gorev-durum">'+

function haritaAgaciModeli(gs){
 var sayilar=Object.create(null),dugmler=[],uyarilar=[];
 gs.forEach(function(g,i){
  var varId=g&&g.id!==undefined&&g.id!==null&&String(g.id)!=="";
  var anahtar=varId?String(g.id):"";
  if(varId)sayilar[anahtar]=(sayilar[anahtar]||0)+1;
  dugmler.push({g:g||{},sira:i,anahtar:anahtar,ust:null,cocuklar:[],legacy:!
   Object.prototype.hasOwnProperty.call(g||{},"ust_gorev_id"),uyari:""});
 });
 dugmler.forEach(function(n){
  if(!n.anahtar)n.uyari="Görev kimliği yok; ilişki kurulmadı.";
  else if(sayilar[n.anahtar]>1)n.uyari="Görev kimliği yineleniyor; belirsiz bağlantılar çizilmedi.";
 });
 var idMap=Object.create(null);
 dugmler.forEach(function(n){if(n.anahtar&&sayilar[n.anahtar]===1)idMap[n.anahtar]=n;});
 dugmler.forEach(function(n){
  if(n.uyari||n.legacy)return;
  var ust=n.g.ust_gorev_id;
  if(ust===null)return;
  if((typeof ust!=="string"&&typeof ust!=="number")||String(ust)===""){
   n.uyari="Üst görev kaydı geçersiz; bağlantı çizilmedi.";return;
  }
  var hedef=idMap[String(ust)];
  if(!hedef){n.uyari=sayilar[String(ust)]?"Üst görev kimliği yineleniyor; bağlantı çizilmedi.":
   "Üst görev #"+String(ust)+" bulunamadı; bağlantı çizilmedi.";return;}
  if(hedef===n){n.uyari="Görev kendisini üst görev gösteriyor; bağlantı çizilmedi.";return;}
  n.ust=hedef;
 });
 dugmler.forEach(function(n){
  var yol=[],yer=Object.create(null),gez=n;
  while(gez&&gez.ust){
   if(yer[gez.sira]!==undefined){
    yol.slice(yer[gez.sira]).forEach(function(d){d.ust=null;
     d.uyari="Üst görev döngüsü saptandı; bu görev bağımsız gösteriliyor.";});
    break;
   }
   yer[gez.sira]=yol.length;yol.push(gez);gez=gez.ust;
  }
 });
 dugmler.forEach(function(n){if(n.ust)n.ust.cocuklar.push(n);});
 dugmler.forEach(function(n){if(n.uyari)uyarilar.push(n);});
 return {dugmler:dugmler,uyarilar:uyarilar};
}

 Array.prototype.forEach.call(yuzey.querySelectorAll(".baglanti-vurgulu"),function(n){

 if(!tur)return;

   if(n.getAttribute(ozellik)===deger)bulunan.push(n);

 if(tur==="gorev"){

function haritaBaglantisiEtkilesimi(ev,acik){
 var kart=ev.target.closest?ev.target.closest(".harita-yuzey [data-h-gorev],.harita-yuzey [data-h-kisi]"):null;
 if(!kart)return;
 if(!acik&&ev.relatedTarget&&kart.contains(ev.relatedTarget))return;
 if(kart.matches(".harita-gorev")){
  var yuzey=document.getElementById("harita-yuzey");
  if(!yuzey)return;
  Array.prototype.forEach.call(yuzey.querySelectorAll(".task-baglanti-vurgulu"),function(n){n.classList.remove("task-baglanti-vurgulu");});
  yuzey.classList.toggle("task-vurgu",acik);
  if(!acik)return;
  var kartlar=Array.prototype.slice.call(yuzey.querySelectorAll(".harita-gorev"));
  var byId=Object.create(null),byParent=Object.create(null),queue=[kart.getAttribute("data-h-gorev")],seen=Object.create(null);
  kartlar.forEach(function(n){var id=n.getAttribute("data-h-gorev"),ust=n.getAttribute("data-h-ust-gorev");
   if(id)byId[id]=n;if(ust)(byParent[ust]||(byParent[ust]=[])).push(id);});
  while(queue.length){var id=queue.shift();if(seen[id])continue;seen[id]=true;
   if(byId[id])byId[id].classList.add("task-baglanti-vurgulu");
   var node=byId[id],ust=node&&node.getAttribute("data-h-ust-gorev");
   if(ust&&byId[ust])queue.push(ust);
   (byParent[id]||[]).forEach(function(child){queue.push(child);});
  }
  return;
 }
 if(acik){
  var gorev=kart.matches(".harita-gorev");
  haritaBaglantisiniVurgula(gorev?"gorev":"kisi",
   kart.getAttribute(gorev?"data-h-gorev":"data-h-kisi"));
 }else haritaBaglantisiniVurgula(null,null);
}

function haritaPanHareket(ev){
 var p=S.haritaPan;
 if(!p||p.id!==ev.pointerId)return;
 var dx=ev.clientX-p.x,dy=ev.clientY-p.y;
 if(!p.basladi&&Math.sqrt(dx*dx+dy*dy)<5)return;
 if(!p.basladi){
  p.basladi=true;p.alan.classList.add("surukleniyor");
  try{p.alan.setPointerCapture(ev.pointerId);}catch(e){}
 }
 p.alan.scrollLeft=p.sol-dx;p.alan.scrollTop=p.ust-dy;
 ev.preventDefault();
}

function haritaPanBitir(ev){

 p.alan.classList.remove("surukleniyor");
 if(p.basladi){
  S.haritaPanKlikEngelle=true;
  window.setTimeout(function(){S.haritaPanKlikEngelle=false;},0);
 }
 try{if(p.alan.hasPointerCapture(ev.pointerId))p.alan.releasePointerCapture(ev.pointerId);}catch(e){}
 S.haritaPan=null;
}

 if(kaydirma&&ev.target===kaydirma){
  var ust=Math.max(0,kaydirma.scrollHeight-kaydirma.clientHeight),adim=Math.max(48,kaydirma.clientHeight-40),hedef=null;
  if(ev.key==="PageDown")hedef=Math.min(ust,kaydirma.scrollTop+adim);

  var d=await r.json();
  if(!d.ok){serit("⚠️ "+mesajHata+": "+d.hata);return false;}

async function durt(mesajlar){
 if(S.hata){serit("⚪ Bağlantı durumu doğrulanamıyor; eski veriye göre çevrimiçi modellere hatırlatma gönderilmedi.");return;}
 var veri=S.veri||{}, ks=veri.kullanicilar||{};
 var hedefler={};
 mesajlar.forEach(function(m){
  hedefKisiler(m,veri).forEach(function(k){
   var v=ks[k]||{};
   if(onlineMi(v)&&!okuduMu(v,m))hedefler[k]=m;
  });
 });
 var kimler=Object.keys(hedefler);
 if(!kimler.length){serit("okumayan çevrimiçi model yok — mesaj gelen kutularında bekliyor.");return;}
 var n=0;
 for(var i=0;i<kimler.length;i++){
  var k=kimler[i], v=ks[k]||{}, m=hedefler[k];
  var ok=await yaz({kimden:"kullanici",ad:"Kullanıcı",kime:"@"+(v.ad||k),tur:"soru",
   metin:"🔔 Panelde seni bekleyen bir mesaj var: “"+String(m.metin||"").slice(0,140)+
    "” — `yuva gelen --from "+k+"` ile bak ve panelden/`yuva yaz` ile yanıtla."});
  if(ok)n++;
 }
 serit("🔔 "+n+" modele hatırlatma gönderildi.");
 cek();
}

async function gonder(){
 var t=document.getElementById("girdi");
 var metin=(t.value||"").trim();
 if(!metin)return;
 var kime=document.getElementById("hedef").value||"@hepsi";
 var tur=S.soru?"soru":"not";
 var veri=S.veri||{}, ks=veri.kullanicilar||{};
 var online=S.hata?null:Object.keys(ks).filter(function(k){return onlineMi(ks[k]);}).length;
 t.value="";S.soru=false;document.getElementById("soru-kutu").checked=false;
 S.hedef=kime;
 var ok=await yaz({kimden:"kullanici",ad:"Kullanıcı",kime:kime,metin:metin,tur:tur});
 if(ok){
  var el=document.getElementById("sohbet");
  el.scrollTop=el.scrollHeight;S.yeni=0;
  if(online===null){
   serit("✅ Mesaj gönderildi; panel verisi kesik olduğu için çevrimiçi hedef sayısı doğrulanamıyor.");
  }else if(!online){
   serit("⚠️ şu an bağlı/çevrimiçi model yok — mesaj gelen kutularına düştü. "+
    "Bir model `yuva gelen` dediğinde (veya panelde 🟢 yandığında) görecek; "+
    "okundu bilgisi mesajın altında görünür.");
  }else if(kime==="@hepsi"){
   serit("✅ "+online+" çevrimiçi modele iletildi — okundu bilgisi mesajın altında.");
  }else{
   serit("✅ "+kime+" adresine iletildi — okundu bilgisi mesajın altında.");
  }
 }
 cek();
}
