<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>🪹 Yuva</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--pnl:#161b22;--pnl2:#1c2430;--brd:#30363d;--fg:#e6edf3;--dim:#8b949e;
--goreci:#f0883e;--isci:#58a6ff;--denetci:#d2a8ff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;
display:grid;grid-template-rows:auto auto 1fr;height:100vh;overflow:hidden}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--brd);
background:var(--pnl)}
header h1{font-size:16px;white-space:nowrap}
.rozet{font-size:12px;padding:1px 9px;border:1px solid var(--brd);border-radius:10px;color:var(--dim)}
.rozet b{color:var(--fg)}
#saat{margin-left:auto;color:var(--dim);font-size:12px}
#serit{background:#3d1d1d;color:#ffb4ab;font-size:12px;padding:5px 14px;border-bottom:1px solid var(--brd)}
.gizli{display:none!important}
main{display:grid;grid-template-columns:minmax(330px,1fr) minmax(460px,1.35fr);min-height:0;overflow:hidden}
#sol{display:grid;grid-template-rows:auto auto 1fr auto;border-right:1px solid var(--brd);min-height:0}
.baslik{font-size:12px;color:var(--dim);padding:7px 14px;border-bottom:1px solid var(--brd);
display:flex;gap:8px;align-items:center}
.ipucu{color:var(--dim);font-size:11px;opacity:.8}
#sohbet{overflow-y:auto;padding:10px 14px}
.msg{margin-bottom:9px}
.msg .satir1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.zaman{color:var(--dim);font-size:11px}
.kimden{font-weight:bold}
.kime{color:var(--dim);font-size:11px}
.metin{white-space:pre-wrap;word-break:break-word}
.msg.ozel{border-left:2px solid var(--brd);padding-left:8px}
.msg.kullanici{background:var(--pnl2);border:1px solid var(--brd);border-radius:8px;padding:8px 10px}
.msg.kullanici .kimden{color:var(--ok)}
.msg.sistem{color:var(--dim);font-size:12px}
.msg.sistem .metin{opacity:.85}
#yazma{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:9px 14px;
border-top:1px solid var(--brd);background:var(--pnl);align-items:end}
select,textarea,input,button{font:inherit;color:var(--fg);background:var(--bg);
border:1px solid var(--brd);border-radius:7px;padding:6px 8px}
select{max-width:150px}
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;padding:6px 24px 6px 9px;
 background-color:var(--pnl2);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%238b949e' stroke-width='1.4'/></svg>");
 background-repeat:no-repeat;background-position:right 7px center;text-overflow:ellipsis}
select option{background:var(--pnl2);color:var(--fg)}
textarea{resize:vertical;min-height:38px}
button{cursor:pointer;background:var(--pnl2)}
button:hover{border-color:var(--dim)}
button.ana{background:#1f6feb;border-color:#1f6feb;color:#fff}
#sag{display:grid;grid-template-rows:auto 1fr;min-height:0}
#sekmeler{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--brd);background:var(--pnl)}
.sekme{border-radius:8px;font-size:13px}
.sekme.aktif{background:var(--pnl2);border-color:var(--dim)}
.bolum{overflow-y:auto;padding:12px;min-height:0}
#b-ekip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-content:start}
.model{background:var(--pnl);border:1px solid var(--brd);border-left:3px solid var(--dim);
border-radius:9px;padding:9px 10px}
.model.online{border-left-color:var(--ok)}
.m-ust{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.isik{font-size:15px;line-height:1}
.m-ad{font-weight:bold;font-size:14px}
.m-kimlik{color:var(--dim);font-size:11px}
.mini{padding:1px 6px;font-size:12px;border-radius:6px}
.m-alt{color:var(--dim);font-size:11px;margin-top:5px}
.m-rol{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.m-rol select{padding:3px 6px;font-size:12px}
.m-rol label{font-size:11px;color:var(--dim);display:flex;gap:4px;align-items:center}
.ad-giris{width:100%;margin-top:6px;font-size:13px}
.rozet-bd{font-size:10px;border:1px solid var(--denetci);color:var(--denetci);
border-radius:8px;padding:0 6px;white-space:nowrap}
.rol-goreci{color:var(--goreci)}.rol-isci{color:var(--isci)}.rol-denetci{color:var(--denetci)}
#b-tahta{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;align-content:start}
.kol{background:var(--pnl);border:1px solid var(--brd);border-radius:9px;min-height:60px}
.kol h3{font-size:12px;padding:6px 9px;border-bottom:1px solid var(--brd);color:var(--dim)}
.kol h3[data-d="pending_verification"]{color:var(--warn)}
.kol h3[data-d="verified"]{color:var(--ok)}
.kol h3[data-d="pending_revision"]{color:var(--err)}
.kart{margin:8px;padding:8px;border:1px solid var(--brd);border-radius:7px;background:var(--bg);font-size:13px}
.kart .id{color:var(--dim)}
.kart .kim{font-size:11px;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);font-size:12px;padding:9px}
.katlanmis{grid-column:1/-1;display:flex;gap:9px;align-items:center;font-size:12px;color:var(--dim);
 border:1px dashed var(--brd);border-radius:9px;padding:6px 10px;background:#0f141b}
.katlanmis button{font-size:12px;padding:2px 9px}
.rozet-say{font-size:10px;border:1px solid var(--brd);border-radius:9px;padding:0 6px;color:var(--dim)}
.rozet-say.bekle{color:var(--warn);border-color:var(--warn)}
.okuma{margin-top:5px;font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.okuma .ok{color:var(--ok)}
.okuma .bek{color:var(--warn)}
.okuma button{padding:0 6px;font-size:11px;border-radius:6px}
.bekleyen-bar{display:flex;gap:9px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--brd);
 background:#2b2210;color:var(--warn);font-size:12px;flex-wrap:wrap}
.bekleyen-bar button{padding:1px 8px;font-size:11px}
.msg.soru{border-left:2px solid var(--warn);padding-left:8px}
.ardil{margin-top:-4px}
.ardil .satir1{opacity:.6}
.yeni-mesaj{position:sticky;bottom:2px;display:flex;justify-content:center;margin-top:6px}
.yeni-mesaj button{background:#1f6feb;border-color:#1f6feb;color:#fff;font-size:12px;
 border-radius:14px;padding:3px 12px;box-shadow:0 3px 10px #000a}
.yaz-sol{display:flex;flex-direction:column;gap:5px;justify-content:flex-end}
.yaz-sol select{width:100%}
.yaz-sol label{font-size:11px;color:var(--dim);display:flex;gap:4px;align-items:center}
.ekran-ust{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;grid-column:1/-1}
#b-ekran.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pencere{background:#010409;border:1px solid var(--brd);border-left:3px solid var(--dim);
border-radius:9px;display:grid;grid-template-rows:auto 1fr;min-height:170px;cursor:zoom-in}
.pencere.online{border-left-color:var(--ok)}
.p-baslik{display:flex;gap:7px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--brd);
font-size:12px;background:var(--pnl)}
.p-baslik .kimlik{color:var(--dim);font-size:11px}
.p-icerik{margin:0;padding:8px 9px;overflow:auto;font-size:12px;line-height:1.45;
white-space:pre-wrap;word-break:break-word;max-height:260px}
.p-icerik.tam{max-height:none;height:100%}
.satir{display:block}
.satir .s-zaman{color:var(--dim);font-size:10px;margin-right:5px}
.satir.komut{color:#7ee787}
.satir.sonuc{color:#79c0ff}
.satir.baslik{color:var(--warn);font-weight:bold}
.pencere.buyuk{min-height:60vh}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:20px}
.modal-kutu{background:var(--bg);border:1px solid var(--brd);border-radius:10px;
width:min(1100px,95vw);height:min(80vh,900px);display:grid;grid-template-rows:auto 1fr}
.modal-baslik{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--brd)}
.modal-baslik .kimlik{color:var(--dim);font-size:12px}
.modal-baslik button{margin-left:auto}
@media (max-width:900px){
 main{grid-template-columns:1fr;grid-template-rows:auto auto}
 #sol{border-right:0;border-bottom:1px solid var(--brd);max-height:52vh}
 #sag{max-height:none}
 .bolum{max-height:60vh}
}
</style></head><body>
<header>
  <h1>🪹 YUVA</h1>
  <span class="rozet" id="ozet">…</span>
  <span class="rozet" id="ipucu-rozet" title="Modeller terminalden `yuva baglan &lt;ad&gt;` der">⌨️ baglan</span>
  <span id="saat"></span>
</header>
<div id="serit" class="gizli"></div>
<main>
  <section id="sol">
    <div class="baslik">💬 Ortak Sohbet
      <span class="ipucu">— buradan yazdığını TÜM modeller görür</span>
      <span class="ipucu" id="sohbet-durum" style="margin-left:auto"></span></div>
    <div id="bekleyen" class="bekleyen-bar gizli"></div>
    <div id="sohbet"></div>
    <div id="yazma">
      <div class="yaz-sol">
        <select id="hedef" title="Mesajın kime gideceği"></select>
        <label title="Soru olarak işaretle: model `yuva gelen` dediğinde ❓ ile görür"><input type="checkbox" id="soru-kutu"> ❓ soru</label>
      </div>
      <textarea id="girdi" rows="2" placeholder="Yaz… (Enter: gönder · Shift+Enter: alt satır)"></textarea>
      <button class="ana" id="gonder">Gönder ➤</button>
    </div>
  </section>
  <section id="sag">
    <nav id="sekmeler">
      <button class="sekme aktif" data-s="ekip">👥 Ekip</button>
      <button class="sekme" data-s="tahta">📋 Tahta</button>
      <button class="sekme" data-s="ekran">🖥️ Ekranlar</button>
    </nav>
    <div id="b-ekip" class="bolum"></div>
    <div id="b-tahta" class="bolum gizli"></div>
    <div id="b-ekran" class="bolum gizli"></div>
  </section>
</main>
<div id="modal" class="gizli">
  <div class="modal-kutu">
    <div class="modal-baslik">
      <span class="isik" id="modal-isik">●</span>
      <b id="modal-ad"></b><span class="kimlik" id="modal-kimlik"></span>
      <span class="ipucu" id="modal-not"></span>
      <button id="modal-kapat">✕ kapat (ESC)</button>
    </div>
    <pre class="p-icerik tam" id="modal-icerik"></pre>
  </div>
</div>
<script>
"use strict";
var S={veri:null,sekme:"ekip",duzenle:null,duzenleDeger:"",modal:null,gorunum:"grid",hata:false,hedef:"@hepsi",
 cevrimdisi:false,ekranHepsi:false,soru:false,sonId:null,yeni:0};
var ROL_AD={goreci:"görevli",isci:"işçi",denetci:"denetçi"};
var ROL_RENK={goreci:"#f0883e",isci:"#58a6ff",denetci:"#d2a8ff"};
var DURUM_AD={pending:"Sırada",assigned:"Atandı",pending_verification:"Teslim ✋",
verified:"Onaylı ✅",pending_revision:"Revize ✎",dropped:"İptal"};
var DURUM_SIRA=["pending","assigned","pending_verification","verified","pending_revision","dropped"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function saat(ts){return String(ts||"").slice(11,16);}
function goreli(ts){
 if(!ts)return "?";
 var t=Date.parse(ts); if(isNaN(t))return "?";
 var sn=Math.round((Date.now()-t)/1000);
 if(sn<5)return "şimdi"; if(sn<60)return sn+" sn önce";
 if(sn<3600)return Math.round(sn/60)+" dk önce";
 if(sn<86400)return Math.round(sn/3600)+" saat önce";
 return Math.round(sn/86400)+" gün önce";}
function kimId(k){return "k-"+String(k).replace(/[^A-Za-z0-9]/g,"_");}
function rolRenk(rol){return ROL_RENK[rol]||"#8b949e";}
function kisi(veri,kimlik){ if(!veri||!veri.kullanicilar)return {}; return veri.kullanicilar[kimlik]||{}; }
function kisiAd(veri,kimlik){var k=kisi(veri,kimlik);return k.ad||kimlik;}
function dipte(el,esik){ if(!el)return true; esik=esik||30; return el.scrollTop+el.clientHeight>=el.scrollHeight-esik; }

function serit(metin){var e=document.getElementById("serit");
 if(metin){e.textContent=metin;e.classList.remove("gizli");}else{e.classList.add("gizli");}}
function onlineMi(v){return !S.hata&&!!(v&&v.online);}
function onlineEtiketi(v){return S.hata?"⚪ bağlantı doğrulanamıyor":
 (v&&v.online?"🟢 bağlı":"⚪ çevrimdışı");}

var cekSira=0;
async function cek(){
 var sira=++cekSira;
 try{
  var r=await fetch("/api/veri",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var d=await r.json();
  if(!d||!d.ok)throw new Error("veri yok");
  if(sira!==cekSira)return;
  S.veri=d; S.hata=false; serit("");
  document.getElementById("saat").textContent="↻ "+new Date().toLocaleTimeString();
 }catch(e){
  if(sira!==cekSira)return;
  if(!S.hata&&S.duzenle){
   var giris=document.getElementById("ad-giris");
   if(giris)S.duzenleDeger=giris.value;
  }
  S.hata=true;
  document.getElementById("saat").textContent="bağlantı yok";
  serit("⚠️ panel verisine ulaşılamıyor ("+String(e.message||e)+") — yeniden deniyorum…");
 }
 ciz();
}

function ciz(){
 var veri=S.veri;
 if(!veri){
  document.getElementById("ozet").innerHTML="<b>—</b> model · çevrimiçi durumu doğrulanamıyor";
  sekmeEtiket(null);
  document.getElementById("b-ekip").innerHTML=
   '<div class="empty">⚠️ Panel verisine ulaşılamıyor; ekip listesi henüz yüklenemedi.</div>';
  document.getElementById("b-ekran").innerHTML=
   '<div class="empty">⚠️ Panel verisine ulaşılamıyor; ekran ve bağlantı durumu doğrulanamıyor.</div>';
  document.getElementById("bekleyen").classList.add("gizli");
  return;
 }
 var ks=veri.kullanicilar||{};
 var kimlikler=Object.keys(ks);
 var online=S.hata?null:kimlikler.filter(function(k){return onlineMi(ks[k]);});
 document.getElementById("ozet").innerHTML=S.hata?
  "<b>—/"+kimlikler.length+"</b> kayıt · çevrimiçi durumu doğrulanamıyor · "+
   (veri.mesajlar||[]).length+" mesaj · rev "+(veri.rev||0):
  "<b>"+online.length+"/"+kimlikler.length+
   "</b> model 🟢 · "+(veri.mesajlar||[]).length+" mesaj · rev "+(veri.rev||0);
 hedefCiz(kimlikler,ks);
 sohbetCiz(veri);
 sohbetDurum(veri);
 sekmeEtiket(online);
 ekipCiz(veri,ks,kimlikler);
 tahtaCiz(veri);
 ekranCiz(veri,ks,kimlikler);
 modalCiz(veri,ks);
}

function sekmeEtiket(online){
 var e=document.querySelector('.sekme[data-s="ekip"]');
 if(!e)return;
 e.textContent=online===null?"👥 Ekip · doğrulanamıyor":
  "👥 Ekip"+(online.length?" · "+online.length+"🟢":"");
}

function hedefCiz(kimlikler,ks){
 var sec=document.getElementById("hedef");
 var eski=S.hedef;
 var html='<option value="@hepsi">@hepsi (herkes)</option>';
 kimlikler.forEach(function(k){
  var v=ks[k]; if(!S.hata&&!onlineMi(v))return;
  var hedef=S.hata&&(eski==="@"+k||eski==="@"+(v.ad||k))?eski:"@"+(v.ad||k);
  html+='<option value="'+esc(hedef)+'">'+(S.hata?"⚪ ":"🟢 ")+"@"+
   esc(v.ad||k)+(S.hata?" · durum doğrulanamıyor":" · "+(ROL_AD[v.rol]||v.rol))+"</option>";
 });
 if(S.hata&&eski!=="@hepsi"&& !kimlikler.some(function(k){
  var v=ks[k]||{};return eski==="@"+(v.ad||k)||eski==="@"+k;
 }))html+='<option value="'+esc(eski)+'">⚪ '+esc(eski)+" · durum doğrulanamıyor</option>";
 sec.innerHTML=html;
 sec.value=eski;
 if(sec.value!==eski&&!S.hata){S.hedef="@hepsi";sec.value="@hepsi";}
}

function sohbetCiz(veri){
 var el=document.getElementById("sohbet");
 var dipteydi=dipte(el);
 var ms=(veri.mesajlar||[]).slice(-80);
 var yeniSayi=0;
 if(S.sonId){
  var i=ms.map(function(x){return x.id;}).indexOf(S.sonId);
  yeniSayi=i>=0?(ms.length-1-i):0;
 }
 var html="";
 if(!ms.length)html='<div class="empty">henüz mesaj yok — aşağıdaki kutudan yaz, tüm modeller görsün.</div>';
 ms.forEach(function(m,idx){
  var kul=(m.kimden==="kullanici");
  var ad=m.ad||m.kimden;
  var rol=kisi(veri,m.kimden).rol;
  var cls="msg"+(kul?" kullanici":(m.tur==="durum"?" sistem":""))+
   (m.kime&&m.kime!=="@hepsi"&&!kul?" ozel":"")+(m.tur==="soru"?" soru":"");
  var onceki=idx>0?ms[idx-1]:null;
  var ardil=!!(onceki&&onceki.kimden===m.kimden&&
   (Date.parse(m.ts)-Date.parse(onceki.ts))>=0&&
   (Date.parse(m.ts)-Date.parse(onceki.ts))<60000);
  var ust=ardil?"<span class=\"zaman\">"+esc(saat(m.ts))+"</span>":
   '<span class="zaman">'+esc(saat(m.ts))+"</span>"+
   '<span class="kimden" style="color:'+(kul?"#3fb950":rolRenk(rol))+'">'+
     esc(kul?"SEN (kullanıcı)":ad)+"</span>"+
   (m.kime&&m.kime!=="@hepsi"&&!kul?'<span class="kime">→ '+esc(m.kime)+"</span>":"")+
   '<span class="kime">'+((m.tur&&m.tur!=="not"&&m.tur!=="durum")?esc(m.tur):"")+"</span>";
  html+='<div class="'+cls+(ardil?" ardil":"")+'"><div class="satir1">'+ust+"</div>"+
   '<div class="metin">'+esc(m.metin)+"</div>"+
   (kul||(m.kime&&m.kime!=="@hepsi")?okumaSatiri(m,veri):"")+"</div>";
 });
 if(S.yeni>0&&!dipteydi)html+='<div class="yeni-mesaj"><button id="yeni-btn">⬇ '+S.yeni+" yeni mesaj</button></div>";
 el.innerHTML=html;
 if(dipteydi){el.scrollTop=el.scrollHeight;S.yeni=0;}else if(yeniSayi>0){S.yeni=yeniSayi;}
 S.sonId=ms.length?ms[ms.length-1].id:S.sonId;
 bekleyenCiz(veri);
}

// hedef kitlesi: mesajı alması gereken kimlikler
function hedefKisiler(m,veri){
 var ks=veri.kullanicilar||{},out=[];
 Object.keys(ks).forEach(function(k){
  var ad=ks[k].ad||k;
  if(m.kimden===k||m.kimden===ad)return;
  if(m.kime==="@hepsi"||m.kime==="@"+ad||m.kime==="@"+k)out.push(k);
 });
 return out;
}
function okuduMu(v,m){return !!(v&&v.son_okuma&&String(m.ts)<=String(v.son_okuma));}

// mesaj başına: kim okudu / kim okumadı
function okumaSatiri(m,veri){
 if(m.tur==="durum")return "";
 if(S.hata)return '<div class="okuma"><span>⚪ çevrimiçi durumu doğrulanamıyor</span></div>';
 var hedef=hedefKisiler(m,veri);
 if(!hedef.length)return "";
 var okuyan=[],bekleyen=[],uykuda=[];
 hedef.forEach(function(k){
  var v=veri.kullanicilar[k];
  if(okuduMu(v,m))okuyan.push(v.ad||k);
  else if(onlineMi(v))bekleyen.push(v.ad||k);
  else uykuda.push(v.ad||k);
 });
 var b="";
 if(okuyan.length)b+='<span class="ok" title="'+esc(okuyan.join(", "))+
  '">👁 '+okuyan.length+"/"+hedef.length+" okudu</span>";
 else b+='<span>📥 '+hedef.length+" modele iletildi — henüz okuyan yok</span>";
 if(bekleyen.length){
  b+='<span class="bek" title="'+esc(bekleyen.join(", "))+
   '">⏳ '+bekleyen.length+" çevrimiçi okumadı</span>";
  b+='<button data-durt="'+esc(m.id)+'" title="okumayan çevrimiçi modellere hatırlatma gönder">🔔 dürt</button>';
 }
 if(uykuda.length)b+='<span title="'+esc(uykuda.join(", "))+
  '">💤 '+uykuda.length+" çevrimdışı</span>";
 return '<div class="okuma">'+b+"</div>";
}

function bekleyenCiz(veri){
 var el=document.getElementById("bekleyen");
 if(S.hata){
  el.classList.remove("gizli");
  el.innerHTML="⚪ Çevrimiçi/çevrimdışı durumu doğrulanamıyor; eski bağlantı verisine göre sayı veya hatırlatma hedefi gösterilmiyor.";
  return;
 }
 var ms=(veri.mesajlar||[]).filter(function(m){return m.kimden==="kullanici";}).slice(-40);
 var onlineK={},offlineK={},mesajlar={};
 ms.forEach(function(m){
  if(m.tur==="durum")return;
  hedefKisiler(m,veri).forEach(function(k){
   var v=veri.kullanicilar[k];
   if(okuduMu(v,m))return;
   mesajlar[m.id]=1;
   if(onlineMi(v))onlineK[v.ad||k]=1;else offlineK[v.ad||k]=1;
  });
 });
 var n=Object.keys(onlineK).length,m2=Object.keys(offlineK).length;
 if(!n&&!m2){el.classList.add("gizli");el.innerHTML="";return;}
 el.classList.remove("gizli");
 var t="📬 ";
 t+=n?"<b>"+n+"</b> çevrimiçi modelin okumadığı <b>"+Object.keys(mesajlar).length+"</b> mesaj var: "+
   esc(Object.keys(onlineK).join(", "))
  :"okumayan çevrimiçi model yok ("+m2+" çevrimdışı model oturumu açınca görecek)";
 t+= n&&m2?" (+"+m2+" çevrimdışı)":"";
 if(n)t+=' <button id="durt-hepsi">🔔 hepsini dürt</button>';
 t+='<span class="ipucu">· modeller `yuva gelen` dediğinde okundu işaretlenir</span>';
 el.innerHTML=t;
}

function sohbetDurum(veri){
 var el=document.getElementById("sohbet-durum");
 if(!el)return;
 var okunmamis={},n=0;
 (veri.mesajlar||[]).filter(function(m){return m.kimden==="kullanici"&&m.tur!=="durum";})
  .slice(-40).forEach(function(m){
   hedefKisiler(m,veri).forEach(function(k){
    if(!okuduMu(veri.kullanicilar[k],m)){okunmamis[m.id]=1;n++;}});
  });
 el.textContent=n?("📬 "+Object.keys(okunmamis).length+" okunmamış mesaj"):"";
}

function modelKart(k,v,veri){
 var on=onlineMi(v), durum=onlineEtiketi(v), renk=rolRenk(v.rol);
 var okunmamis=0;
 (veri.mesajlar||[]).slice(-60).forEach(function(m){
  if(m.kimden===k||m.tur==="durum")return;
  var benim=(m.kimden==="kullanici"&&m.kime==="@hepsi")||m.kime==="@"+(v.ad||k)||m.kime==="@"+k;
  if(benim&&!okuduMu(v,m))okunmamis++;
 });
 var html='<div class="model'+(on?" online":"")+'" style="border-left-color:'+(on?"#3fb950":renk)+'">';
 html+='<div class="m-ust"><span class="isik" title="'+durum+
  '" style="color:'+(on?"#3fb950":"#8b949e")+'">●</span>';
 if(S.duzenle===k){
  html+='<input class="ad-giris" id="ad-giris" value="'+esc(S.duzenleDeger)+
   '" placeholder="ad (örn. sam) — Enter: kaydet, ESC: vazgeç">';
 }else{
  html+='<span class="m-ad rol-'+esc(v.rol)+'">'+esc(v.ad||k)+"</span>";
  if(v.bas_denetci)html+='<span class="rozet-bd">🔍 BAŞ DENETÇİ</span>';
  if(okunmamis&&on)html+='<span class="rozet-say bekle" title="bu modelin henüz okumadığı mesaj">📬 '+okunmamis+"</span>";
  html+='<button class="mini" data-ad-ver="'+esc(k)+'" title="bu modele isim ver">✏️</button>';
 }
 html+="</div>";
 html+='<div class="m-alt">'+esc(k)+" · "+esc(v.arac)+" · "+(ROL_AD[v.rol]||v.rol)+
  " · "+durum+" · "+esc(goreli(v.son_gorulme))+"</div>";
 if(S.duzenle!==k){
  html+='<div class="m-rol"><select data-rol="'+esc(k)+'" title="görev ataması">';
  ["goreci","isci","denetci"].forEach(function(r){
   html+='<option value="'+r+'"'+(v.rol===r?" selected":"")+">"+ROL_AD[r]+"</option>";});
  html+="</select>";
  html+='<label><input type="checkbox" data-bd="'+esc(k)+'"'+(v.bas_denetci?" checked":"")+
   (v.rol==="denetci"?"":" disabled")+"> baş denetçi</label>";
  html+="</div>";
 }
 html+="</div>";
 return html;
}

function ekipCiz(veri,ks,kimlikler){
 var el=document.getElementById("b-ekip");
 var oldInput=S.duzenle&&document.getElementById("ad-giris");
 var editActive=!!(oldInput&&document.activeElement===oldInput);
 var selectionStart=editActive?oldInput.selectionStart:null;
 var selectionEnd=editActive?oldInput.selectionEnd:null;
 if(oldInput)S.duzenleDeger=oldInput.value;
 function editGeriYukle(){
  if(!S.duzenle)return;
  var input=document.getElementById("ad-giris");
  if(!input)return;
  if(editActive||!oldInput){
   input.focus();
   if(editActive&&selectionStart!==null)input.setSelectionRange(selectionStart,selectionEnd);
   else input.select();
  }
 }
 function sirala(dizi){
  return dizi.slice().sort(function(a,b){
   return String(ks[a].ad||a).localeCompare(String(ks[b].ad||b),"tr");});
 }
 if(S.hata){
  var stale='<div class="empty">'+(kimlikler.length?
   "⚪ Bağlantı durumu doğrulanamıyor. Kartlar son alınan panel verisinden gösteriliyor.":
   "⚠️ Panel verisi alınamadı; ekip durumu yüklenemedi.")+"</div>";
  stale+=sirala(kimlikler).map(function(k){return modelKart(k,ks[k],veri);}).join("");
  el.innerHTML=stale;
  editGeriYukle();
  return;
 }
 if(!kimlikler.length){
  el.innerHTML='<div class="empty">henüz model yok. Terminalde:<br>'+
   '<code>yuva baglan codex-1 --ad sam --arac codex --rol denetci</code></div>';
  return;
 }
 var online=[],offline=[];
 kimlikler.forEach(function(k){(onlineMi(ks[k])?online:offline).push(k);});
 var html="";
 if(!online.length){
  html+='<div class="empty">🟢 şu an bağlı model yok.<br>Bir model terminalde '+
   "<code>yuva baglan &lt;ad&gt;</code> dediğinde buraya kartı düşer.</div>";
 }
 html+=sirala(online).map(function(k){return modelKart(k,ks[k],veri);}).join("");
 if(offline.length){
  html+='<div class="katlanmis"><span>⚪ '+offline.length+" çevrimdışı model"+
   (S.cevrimdisi?"":" (gizli)")+'</span><button class="mini" id="cd-ac">'+
   (S.cevrimdisi?"▲ gizle":"▼ göster")+"</button></div>";
  if(S.cevrimdisi)html+=sirala(offline).map(function(k){return modelKart(k,ks[k],veri);}).join("");
 }
 el.innerHTML=html;
 editGeriYukle();
}

function ekranCiz(veri,ks,kimlikler){
 var el=document.getElementById("b-ekran");
 var ekranlar=veri.ekranlar||{};
 if(S.gorunum!=="grid" && S.gorunum!=="akis" && !ks[S.gorunum])S.gorunum="grid";
 var ust='<div class="ekran-ust"><label class="ipucu">Görünüm:</label>'+
  '<select id="ekran-gorunum">'+
  '<option value="grid"'+(S.gorunum==="grid"?" selected":"")+">🗂️ Hepsi (yan yana)</option>"+
  '<option value="akis"'+(S.gorunum==="akis"?" selected":"")+">🧵 Birleşik akış</option>"+
  ekranSecenekleri(ks,kimlikler)+
  "</select><span class='ipucu'>pencereye tıkla → tam ekran</span>"+
  (S.hata?"<span class='ipucu'>⚪ çevrimiçi durumu doğrulanamıyor</span>":"")+"</div>";
 var govde="";

 if(S.gorunum==="akis"){
  var hepsi=[];
  Object.keys(ekranlar).forEach(function(k){
   (ekranlar[k]||[]).forEach(function(s){hepsi.push(s);});});
  hepsi.sort(function(a,b){return String(a.ts).localeCompare(String(b.ts));});
  govde=hepsi.length?satirlarHtml(veri,hepsi,false)
   :'<div class="empty">henüz ekran yok.</div>';
  el.classList.remove("grid");
  el.innerHTML=ust+'<pre class="p-icerik tam" style="height:60vh">'+govde+"</pre>";
  return;
 }

 if(S.gorunum!=="grid" && ks[S.gorunum]){
  var k=S.gorunum, v=ks[k], ss=ekranlar[k]||[];
  govde=ss.length?satirlarHtml(veri,ss,true)
   :'<div class="empty">henüz ekran yok — model <code>yuva ekran "..."</code> ile yazacak.</div>';
  el.classList.remove("grid");
  var on=onlineMi(v), durum=onlineEtiketi(v);
  el.innerHTML=ust+'<div class="pencere buyuk'+(on?" online":"")+'" data-buyut="'+esc(k)+'">'+
   '<div class="p-baslik"><span class="isik" style="color:'+(on?"#3fb950":"#8b949e")+'">●</span>'+
   "<b>"+esc(v.ad||k)+'</b><span class="kimlik">'+esc(k)+"</span>"+
   '<span class="ipucu">'+durum+"</span></div>"+
   '<pre class="p-icerik tam" id="ekran-'+kimId(k)+'">'+govde+"</pre></div>";
  return;
 }

 // grid: her bağlı model için bir pencere (+ ekranı olan modeller)
 if(!kimlikler.length && !Object.keys(ekranlar).length){
  el.classList.remove("grid");
  el.innerHTML=ust+'<div class="empty">'+(S.hata?
   "⚠️ Panel verisine ulaşılamıyor; ekip ve ekran durumu doğrulanamıyor.":
   "henüz model yok.")+"</div>";
  return;
 }
 var kapaklar=[],gizli=[];
 kimlikler.forEach(function(k){
  var var_=S.hata||onlineMi(ks[k])||((ekranlar[k]||[]).length>0);
  (var_?kapaklar:gizli).push(k);
 });
 Object.keys(ekranlar).forEach(function(k){if(kapaklar.indexOf(k)<0)kapaklar.push(k);});
 if(S.ekranHepsi)gizli.slice().forEach(function(k){kapaklar.push(k);});
 var dipteler={};
 kapaklar.forEach(function(k){var e=document.getElementById("ekran-"+kimId(k));
  if(e)dipteler[k]=dipte(e,24);});
 var g="";
 kapaklar.forEach(function(k){
  var v=ks[k]||{}, ss=ekranlar[k]||[], on=onlineMi(v), durum=onlineEtiketi(v);
  g+='<div class="pencere'+(on?" online":"")+'" data-buyut="'+esc(k)+'">'+
   '<div class="p-baslik"><span class="isik" style="color:'+(on?"#3fb950":"#8b949e")+'" title="'+
   durum+'">●</span><b>'+esc(v.ad||k)+'</b>'+
   '<span class="kimlik">'+esc(k)+"</span>"+
   '<span class="ipucu">'+durum+" · "+esc(goreli(v.son_gorulme))+"</span></div>"+
   '<pre class="p-icerik" id="ekran-'+kimId(k)+'">'+
   (ss.length?satirlarHtml(veri,ss,true):'<span class="ipucu">ekran boş — model bekleniyor…</span>')+
   "</pre></div>";
 });
 el.classList.add("grid");
 if(!kapaklar.length)g='<div class="empty" style="grid-column:1/-1">'+(S.hata?
  "⚪ Bağlantı durumu doğrulanamıyor; son ekranda model kaydı görünmüyor.":
  "🟢 şu an bağlı model yok — bir model bağlanınca ekranı burada açılır.")+"</div>";
 if(gizli.length)g+='<div class="katlanmis"><span>⚪ '+gizli.length+" çevrimdışı model"+
  (S.ekranHepsi?" gösteriliyor":"in ekranı gizli")+'</span><button class="mini" id="ekran-hepsi">'+
  (S.ekranHepsi?"▲ gizle":"▼ göster")+"</button></div>";
 el.innerHTML=ust+g;
 kapaklar.forEach(function(k){var e=document.getElementById("ekran-"+kimId(k));
  if(e && (dipteler[k]===undefined || dipteler[k]))e.scrollTop=e.scrollHeight;});
}

async function yaz(govde){
 try{
  var r=await fetch("/api/yaz",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify(govde)});
  var d=await r.json();
  if(!d.ok)serit("⚠️ mesaj gönderilemedi: "+d.hata);
  return d.ok;
 }catch(e){serit("⚠️ mesaj gönderilemedi: "+String(e.message||e));return false;}
}

async function kisiGonder(yol,govde,mesajHata){

   body:JSON.stringify(govde)});

  serit("");return true;
 }catch(e){serit("⚠️ "+mesajHata+": "+String(e.message||e));return false;}
}

 serit("🔔 "+n+" modele hatırlatma gönderildi.");
 cek();

  el.scrollTop=el.scrollHeight;S.yeni=0;
  if(online===null){
   serit("✅ Mesaj gönderildi; panel verisi kesik olduğu için çevrimiçi hedef sayısı doğrulanamıyor.");
  }else if(!online){
   serit("⚠️ şu an bağlı/çevrimiçi model yok — mesaj gelen kutularına düştü. "+
    "Bir model `yuva gelen` dediğinde (veya panelde 🟢 yandığında) görecek; "+
    "okundu bilgisi mesajın altında görünür.");
  }else if(kime==="@hepsi"){
   serit("✅ "+online+" çevrimiçi modele iletildi — okundu bilgisi mesajın altında.");
  }else{
   serit("✅ "+kime+" adresine iletildi — okundu bilgisi mesajın altında.");
  }
 }
 cek();
}

cek();
setInterval(cek,2000);
</script></body></html>
