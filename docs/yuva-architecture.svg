<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="yt yd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="yt">Yuva architecture</title>
  <desc id="yd">A human operator uses a web panel. The panel and the agent sessions (Claude Code, Codex CLI, opencode) both go through the Yuva CLI, which reads and writes the shared state: task ledger, live screen logs, shared chat and presence state.</desc>
  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6783"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="778" rx="24" fill="#f2f4f9" stroke="#d6dcea" stroke-width="2"/>

  <!-- logo: a nest with three eggs, one per agent -->
  <ellipse cx="64" cy="58" rx="8" ry="10" fill="#ffffff" stroke="#18213a" stroke-width="2"/>
  <ellipse cx="76" cy="54" rx="8" ry="10" fill="#ffffff" stroke="#18213a" stroke-width="2"/>
  <ellipse cx="88" cy="58" rx="8" ry="10" fill="#ffffff" stroke="#18213a" stroke-width="2"/>
  <path d="M42 60 C46 92 106 92 110 60 C96 67 56 67 42 60 Z" fill="#f1c27d" stroke="#18213a" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="126" y="72" class="f" font-size="38" font-weight="700" fill="#18213a">Yuva</text>
  <text x="126" y="100" class="f" font-size="16" fill="#5b6783">Shared tasks, chat and presence for Claude Code, Codex and opencode sessions</text>

  <!-- human operator -->
  <rect x="48" y="190" width="190" height="70" rx="35" fill="#e8eafc" stroke="#6f7bd9" stroke-width="2"/>
  <text x="143" y="223" text-anchor="middle" class="f" font-size="16" font-weight="700" fill="#18213a">Human operator</text>
  <text x="143" y="243" text-anchor="middle" class="f" font-size="12" fill="#5b6783">in the browser</text>
  <path d="M238 225 H298" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="268" y="213" text-anchor="middle" class="f" font-size="12" fill="#5b6783">use panel</text>

  <!-- web panel -->
  <rect x="300" y="140" width="400" height="170" rx="16" fill="#fff7e3" stroke="#d9962b" stroke-width="2"/>
  <text x="322" y="168" class="f" font-size="15" font-weight="700" fill="#8a5a00">Web panel</text>
  <rect x="508" y="152" width="176" height="24" rx="12" fill="#fde7b0" stroke="#d9962b" stroke-width="1.2"/>
  <text x="596" y="168" text-anchor="middle" class="m" font-size="11.5" fill="#6e4700">yuva-panel.service</text>
  <rect x="320" y="196" width="160" height="76" rx="12" fill="#ffe9b8" stroke="#d9962b" stroke-width="1.6"/>
  <text x="400" y="230" text-anchor="middle" class="f" font-size="15" font-weight="700" fill="#18213a">Panel interface</text>
  <text x="400" y="251" text-anchor="middle" class="m" font-size="12" fill="#5b6783">ui.html</text>
  <rect x="520" y="196" width="160" height="76" rx="12" fill="#ffe9b8" stroke="#d9962b" stroke-width="1.6"/>
  <text x="600" y="230" text-anchor="middle" class="f" font-size="15" font-weight="700" fill="#18213a">Panel API server</text>
  <text x="600" y="251" text-anchor="middle" class="m" font-size="12" fill="#5b6783">server.py</text>
  <path d="M480 234 H518" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="500" y="297" text-anchor="middle" class="f" font-size="12" fill="#8a5a00">live view of tasks, chat and logs</text>

  <!-- agent sessions -->
  <rect x="800" y="140" width="352" height="170" rx="16" fill="#f1edff" stroke="#7a62e0" stroke-width="2"/>
  <text x="822" y="168" class="f" font-size="15" font-weight="700" fill="#4a36b0">Agent sessions</text>
  <rect x="824" y="184" width="304" height="30" rx="15" fill="#ffffff" stroke="#b7a8f0" stroke-width="1.4"/>
  <text x="844" y="204" class="m" font-size="13" font-weight="700" fill="#7a62e0">&gt;_</text>
  <text x="878" y="204" class="f" font-size="14" fill="#18213a">Claude Code</text>
  <rect x="824" y="222" width="304" height="30" rx="15" fill="#ffffff" stroke="#b7a8f0" stroke-width="1.4"/>
  <text x="844" y="242" class="m" font-size="13" font-weight="700" fill="#7a62e0">&gt;_</text>
  <text x="878" y="242" class="f" font-size="14" fill="#18213a">Codex CLI</text>
  <rect x="824" y="260" width="304" height="30" rx="15" fill="#ffffff" stroke="#b7a8f0" stroke-width="1.4"/>
  <text x="844" y="280" class="m" font-size="13" font-weight="700" fill="#7a62e0">&gt;_</text>
  <text x="878" y="280" class="f" font-size="14" fill="#18213a">opencode</text>

  <!-- group to CLI -->
  <path d="M600 310 V388" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="612" y="354" class="f" font-size="12" fill="#5b6783">task commands</text>
  <path d="M900 310 V388" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="888" y="354" text-anchor="end" class="f" font-size="12" fill="#5b6783">invoke commands</text>
  <path d="M1030 388 V312" stroke="#5b6783" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/>
  <text x="1042" y="347" class="f" font-size="12" fill="#5b6783">delivery (planned)</text>
  <text x="1042" y="364" class="m" font-size="12" fill="#5b6783">yuva wait</text>

  <!-- Yuva CLI hub -->
  <rect x="48" y="390" width="1104" height="96" rx="16" fill="#2f6fd6"/>
  <text x="80" y="435" class="f" font-size="26" font-weight="700" fill="#ffffff">Yuva CLI</text>
  <text x="80" y="461" class="f" font-size="14" fill="#ffffff" fill-opacity="0.9">One entry point for tasks, chat, logs and presence, for agents and the panel alike.</text>
  <rect x="884" y="410" width="236" height="56" rx="12" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1002" y="434" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#ffffff">protokol.md</text>
  <text x="1002" y="454" text-anchor="middle" class="f" font-size="12" fill="#ffffff" fill-opacity="0.9">agent protocol</text>

  <!-- CLI to shared state -->
  <path d="M186 486 V596" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="198" y="522" class="f" font-size="12" fill="#5b6783">manage tasks</text>
  <path d="M462 486 V596" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="474" y="522" class="f" font-size="12" fill="#5b6783">publish output</text>
  <path d="M738 486 V596" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="750" y="522" class="f" font-size="12" fill="#5b6783">read and write</text>
  <path d="M1014 486 V596" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="1026" y="522" class="f" font-size="12" fill="#5b6783">register and pulse</text>

  <!-- shared state -->
  <rect x="48" y="546" width="1104" height="176" rx="16" fill="#edf8f1" stroke="#2e9e63" stroke-width="2"/>
  <text x="72" y="574" class="f" font-size="15" font-weight="700" fill="#1c6b41">Shared state</text>

  <path d="M86 610 V680 A100 12 0 0 0 286 680 V610" fill="#c9eed7" stroke="#2e9e63" stroke-width="1.8"/>
  <ellipse cx="186" cy="610" rx="100" ry="12" fill="#def6e8" stroke="#2e9e63" stroke-width="1.8"/>
  <text x="186" y="650" text-anchor="middle" class="f" font-size="16" font-weight="700" fill="#18213a">Task ledger</text>
  <text x="186" y="670" text-anchor="middle" class="f" font-size="12" fill="#5b6783">tasks and their status</text>

  <path d="M362 610 V680 A100 12 0 0 0 562 680 V610" fill="#c9eed7" stroke="#2e9e63" stroke-width="1.8"/>
  <ellipse cx="462" cy="610" rx="100" ry="12" fill="#def6e8" stroke="#2e9e63" stroke-width="1.8"/>
  <text x="462" y="650" text-anchor="middle" class="f" font-size="16" font-weight="700" fill="#18213a">Live screen logs</text>
  <text x="462" y="670" text-anchor="middle" class="f" font-size="12" fill="#5b6783">what each agent prints</text>

  <path d="M638 610 V680 A100 12 0 0 0 838 680 V610" fill="#c9eed7" stroke="#2e9e63" stroke-width="1.8"/>
  <ellipse cx="738" cy="610" rx="100" ry="12" fill="#def6e8" stroke="#2e9e63" stroke-width="1.8"/>
  <text x="738" y="650" text-anchor="middle" class="f" font-size="16" font-weight="700" fill="#18213a">Shared chat</text>
  <text x="738" y="670" text-anchor="middle" class="f" font-size="12" fill="#5b6783">messages between all parties</text>

  <path d="M914 610 V680 A100 12 0 0 0 1114 680 V610" fill="#c9eed7" stroke="#2e9e63" stroke-width="1.8"/>
  <ellipse cx="1014" cy="610" rx="100" ry="12" fill="#def6e8" stroke="#2e9e63" stroke-width="1.8"/>
  <text x="1014" y="650" text-anchor="middle" class="f" font-size="16" font-weight="700" fill="#18213a">Presence state</text>
  <text x="1014" y="670" text-anchor="middle" class="f" font-size="12" fill="#5b6783">which agents are registered</text>

  <!-- legend and footer -->
  <path d="M48 752 H92" stroke="#5b6783" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="102" y="757" class="f" font-size="12" fill="#5b6783">available</text>
  <path d="M190 752 H234" stroke="#5b6783" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/>
  <text x="244" y="757" class="f" font-size="12" fill="#5b6783">planned</text>
  <text x="1152" y="757" text-anchor="end" class="m" font-size="12" fill="#5b6783">github.com/yucelismail/yuva</text>
</svg>
