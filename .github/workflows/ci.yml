name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    name: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum Python for syntax check
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.8"

      - name: Check Python source syntax
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/check_python_syntax.py

      - name: Set up Python 3.8 for minimum-version unittest
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.8"

      - name: Run unittest suite on Python 3.8
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/run_tests.py

      - name: Set up Python 3.15 for current-stable unittest
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Run unittest suite on Python 3.15
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/run_tests.py
